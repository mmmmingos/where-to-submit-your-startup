# A failed request needs investigation; do not count 403/429 as successful checks.
timeout = 30
max_retries = 2
max_concurrency = 4
include_mail = false

# Contribution examples are placeholders, not real destinations.
include_verbatim = false

# Bot walls / auth gates investigated 2026-09-24 on PR #1.
# Manual review: these directories are live; automated GET is blocked (403/401/405).
# Re-check periodically; remove an exclusion only after lychee gets a clean 2xx.
# Note: TOML literal strings keep backslashes as-is (one \ before each regex dot).
exclude = [
  '^https://www\.g2\.com/',
  '^https://www\.capterra\.com/',
  '^https://www\.getapp\.com/',
  '^https://www\.f6s\.com/',
  '^https://www\.crunchbase\.com/',
  '^https://wellfound\.com/company/',
  '^https://www\.discovercloud\.com/program/',
  # 2026-09-24, PR #5: CI receives 403, while Betabound opens with HTTP 200 in Chrome.
  '^https://betabound\.com/$',
  # 2026-09-24, PR #5: official help article is indexed; direct access shows a
  # Cloudflare challenge (403). Keep the instructions linked; recheck manually.
  '^https://support\.crunchbase\.com/hc/en-us/articles/115011823988-How-do-I-create-a-Crunchbase-profile$',
  # 2026-09-24, PR #5: CI and manual browser/HTTP requests repeatedly timed out.
  # Availability remains unconfirmed and is flagged in the README row.
  '^https://arcticstartup\.com/$',
  # Historical URL intentionally linked under Reported submission problems.
  # 2026-09-24: TLS verification fails because its certificate has expired.
  # Revisit manually; this exclusion does not mean the site is healthy.
  '^https://www\.allstartups\.info/$',
  # 2026-09-25: Reddit returns 403 to automated GET from CI; communities open in a
  # normal browser. Manual rules review recorded in README Notes / problems rows.
  '^https://www\.reddit\.com/',
  # 2026-09-25: intentionally linked under Reported submission problems; site unreachable from CI.
  '^https://launched\.io/',
  # 2026-09-25: intentionally linked under Reported submission problems; SSL certificate expired.
  '^https://app\.loopinput\.com/',
]
