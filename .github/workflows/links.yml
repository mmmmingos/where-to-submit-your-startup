name: Link checks

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - lychee.toml
      - .github/workflows/links.yml
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - lychee.toml
      - .github/workflows/links.yml
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --verbose --no-progress README.md CONTRIBUTING.md
          fail: true
          jobSummary: true
          output: lychee/out.md
      - name: Save report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-check-report
          path: lychee/out.md
          if-no-files-found: warn
          retention-days: 30
